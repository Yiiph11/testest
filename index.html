function Nav(){const y=useScrollY();const[o,s]=useState(false);const sc=y>40;useEffect(()=>{document.body.style.overflow=o?'hidden':'';return()=>{document.body.style.overflow=''}},[o]);const links=[{href:'#estudio',label:'Estudio'},{href:'#objetivo',label:'Objetivo'},{href:'#proyectos',label:'Proyectos'},{href:'#equipo',label:'Equipo'},{href:'#comunidad',label:'Comunidad'},{href:'#faq',label:'FAQ'},{href:'#terminos',label:'Términos'}];return <header className={`nav ${sc?'scrolled':''}`}><div className="wrap nav-inner"><a href="#top" className="brand" onClick={e=>handleAnchorClick(e,'#top')}><span className="brand-logo"><SmartImg src={A.logoWylder} alt="Wylder" fallback="W"/></span><span className="brand-text"><b>Wylder</b><span>Creative Studio</span></span></a><nav className={`nav-links ${o?'open':''}`}>{links.map(l=><a key={l.href} href={l.href} onClick={e=>{handleAnchorClick(e,l.href);s(false)}}>{l.label}</a>)}</nav><a href="#comunidad" className="nav-cta" onClick={e=>handleAnchorClick(e,'#comunidad')}>Únete al estudio <Icon.Arrow/></a><button className={`burger ${o?'open':''}`} onClick={()=>s(v=>!v)} aria-label="Menú"><span></span><span></span><span></span></button></div></header>}
function Hero(){return <section className="hero" id="top"><div className="wrap hero-grid"><div><span className="eyebrow" style={{opacity:0,animation:'fadeUp 1s var(--ease-out) .2s forwards'}}>Estudio creativo hispanohablante</span><h1 className="hero-title" style={{marginTop:'1.6rem'}}><span className="line"><i>Voces que <em>respiran</em>,</i></span><span className="line"><i>trazos que laten,</i></span><span className="line"><i>historias que sienten.</i></span></h1><p className="lede hero-sub">Wylder Creative Studio reúne a creadores hispanohablantes dedicados al <strong style={{color:'var(--cream-2)',fontWeight:500}}> doblaje</strong> y la <strong style={{color:'var(--cream-2)',fontWeight:500}}> animación</strong>. Construimos personajes, mundos y piezas audiovisuales con identidad propia, cuidando cada detalle y trabajando desde la colaboración real.</p><div className="hero-actions"><a className="btn btn-primary" href="#proyectos" onClick={e=>handleAnchorClick(e,'#proyectos')}>Ver portafolio <Icon.Arrow/></a><a className="btn btn-ghost" href="#estudio" onClick={e=>handleAnchorClick(e,'#estudio')}>Conoce el estudio <Icon.Arrow/></a></div><div className="hero-meta"><div className="item"><strong>3</strong><span>Proyectos</span></div><div className="item"><strong>3</strong><span>Disciplinas</span></div><div className="item"><strong>16+</strong><span>Edad mínima</span></div><div className="item"><strong>MX</strong><span>Jurisdicción</span></div></div></div><div className="hero-visual"><div className="hv-frame"><div className="hv-gif"></div></div><div className="hv-rings"><div className="hv-ring"></div><div className="hv-ring"></div><div className="hv-ring"></div><div className="hv-core"><SmartImg src={A.logoWylder} alt="Icono Wylder" fallback="W"/></div></div><span className="hv-tag t1"><SmartImg src={A.doblajeIcon} alt="" fallback="◉"/> Doblaje</span><span className="hv-tag t2"><SmartImg src={A.animeIcon} alt="" fallback="✦"/> Animación</span><span className="hv-tag t3"><SmartImg src={A.proIcon} alt="" fallback="⌘"/> Creación</span><div className="hv-bar"></div></div></div></section>}
function Marquee(){const it=['Doblaje profesional','Animación 2D & 3D','Dirección de voz','Motion graphics','Producción audiovisual','Storyboard & concept','Diseño sonoro','Creación multimedia'];return <div className="marquee" aria-hidden="true"><div className="marquee-track">{[...it,...it].map((x,i)=><div key={i} className="marquee-item">{x}</div>)}</div></div>}
function Estudio(){const P=[{img:A.doblajeIcon,fi:<Icon.Mic/>,t:'Doblaje',x:'Dirección de voz, adaptación, casting y grabación. Buscamos que cada personaje respire verdad, intención y matiz emocional.'},{img:A.animeIcon,fi:<Icon.Play/>,t:'Animación',x:'Animación 2D, 3D y motion graphics. Del storyboard al render final, con una dirección de arte propia y coherente.'},{img:A.proIcon,fi:<Icon.Code/>,t:'Creación',x:'Producción audiovisual integral: guion, diseño sonoro, edición y postproducción trabajando en una sola dirección creativa.'},{img:null,fi:<Icon.Users/>,t:'Comunidad',x:'Un espacio de colaboración real donde cada rol importa. El crecimiento del estudio es el crecimiento de todos.'}];return <section id="estudio"><div className="wrap"><Reveal className="section-head"><span className="eyebrow">01 — Quiénes somos</span><h2>Un estudio donde la voz, el trazo<br/>y la imagen se encuentran.</h2><p className="lede">Wylder Creative Studio nació de una idea sencilla: el talento hispanohablante merece un espacio donde pueda crecer sin fronteras, con estándares profesionales y una cultura de colaboración real.</p></Reveal><div className="info-grid"><Reveal variant="left" className="info-copy"><p>No somos solo un colectivo de voces. Somos un ecosistema creativo: actores y actrices de doblaje que dan alma a los personajes, animadores que construyen el movimiento, y creadores que diseñan cada pieza con intención artística.</p><p>Trabajamos con procesos claros, comunicación abierta y un respeto profundo por el trabajo de cada persona. Cada proyecto se trata como una obra: cuidamos el detalle, el ritmo y la emoción.</p><p>Nuestra <strong style={{color:'var(--cream-2)',fontWeight:500}}>visión</strong> es consolidar una comunidad sólida donde el doblaje, la animación y la creación multimedia dialoguen entre sí, generando proyectos que puedan sostenerse, crecer y monetizarse de forma justa para todos los implicados.</p><p>Nuestra <strong style={{color:'var(--cream-2)',fontWeight:500}}>cultura</strong> se basa en tres pilares: transparencia, mérito y colaboración. Aquí nadie trabaja en el vacío: cada rol importa y cada aporte se reconoce.</p></Reveal><div className="pillars">{P.map((p,i)=><Reveal key={p.t} variant="right" delay={i*100}><div className="pillar glass glass-hover"><div className="pillar-icon">{p.img?<SmartImg src={p.img} alt={p.t} fallback={p.fi}/>:<span className="fallback">{p.fi}</span>}</div><div><h3>{p.t}</h3><p>{p.x}</p></div></div></Reveal>)}</div></div></div></section>}
function Objetivo(){const S=[{n:'100%',l:'Talento hispanohablante'},{n:'3',l:'Disciplinas integradas'},{n:'60/40',l:'Reparto transparente'},{n:'MX',l:'Base y jurisdicción'}];return <section id="objetivo"><div className="wrap"><Reveal variant="scale"><div className="objetivo-panel glass"><span className="eyebrow center">02 — Nuestro objetivo</span><p className="quote">Unir el talento hispanohablante en una sola fuerza creativa, para que<em> cada voz, cada trazo y cada historia</em> encuentren su lugar.</p><p className="lede" style={{marginTop:'1.8rem',marginInline:'auto'}}>Buscamos que ningún creador tenga que elegir entre calidad y comunidad. Nuestra misión es construir una estructura donde el trabajo bien hecho se sostenga, se comparta y se recompense de forma justa.</p><div className="stats">{S.map(s=><div key={s.l} className="stat glass"><strong>{s.n}</strong><span>{s.l}</span></div>)}</div></div></Reveal></div></section>}

function ProjectCard({p,delay}){const r=useRef(null);const mv=e=>{const c=r.current;if(!c)return;const b=c.getBoundingClientRect();const px=(e.clientX-b.left)/b.width-.5;const py=(e.clientY-b.top)/b.height-.5;c.style.transform=`perspective(900px) rotateY(${px*3.5}deg) rotateX(${-py*3.5}deg) translateY(-6px)`};const lv=()=>{if(r.current)r.current.style.transform=''};return <Reveal delay={delay} variant="up"><article ref={r} className="project glass glass-hover" data-cat={p.cat} onMouseMove={mv} onMouseLeave={lv}><div className="project-visual"><SmartImg src={p.media} alt={p.title} className="project-media" fallback={p.mediaFallback}/><div className="overlay"></div><div className="pv-scan"></div><span className="project-badge"><SmartImg src={p.badgeIcon} alt="" fallback={p.badgeFallback}/>{p.catLabel}</span><span className={`project-status ${p.statusClass||''}`}>{p.status}</span></div><div className="project-body"><h3>{p.title}</h3><p>{p.desc}</p><div className="project-tags">{p.tags.map(t=><span key={t} className="tag">{t}</span>)}</div><a className="project-cta" href={p.link} target="_blank" rel="noopener noreferrer" onClick={e=>e.stopPropagation()}>{p.cta} <Icon.Arrow/></a></div></article></Reveal>}

const FAQS=[{q:'¿Cuál es la edad mínima para unirme al estudio?',a:<>La edad mínima es de <strong>16 años cumplidos</strong>. Si eres menor de edad y tu participación implica algún tipo de contraprestación económica, se entiende que cuentas con la autorización implícita de tu tutor legal, conforme a la legislación mexicana aplicable.</>},{q:'¿Cómo funciona el reparto de ganancias?',a:<>El modelo es <strong>60% para el equipo de producción</strong> y <strong>40% para Wylder Creative Studio</strong>, calculado sobre las ganancias netas. Este reparto <em>únicamente aplica si el proyecto genera ingresos reales</em>. Si un proyecto no monetiza, no hay ninguna obligación de pago para ninguna de las partes.</>},{q:'¿Qué pasa si un proyecto no genera ingresos?',a:<>No ocurre nada: el reparto 60/40 <strong>solo se activa cuando existe monetización real</strong>. La participación en proyectos no monetizados es completamente voluntaria y forma parte del crecimiento creativo y del portafolio de cada miembro.</>},{q:'¿Puedo participar en varias áreas a la vez?',a:<>Sí. Muchos de nuestros miembros colaboran en doblaje y animación, o en animación y creación multimedia. Valoramos el perfil multidisciplinario, siempre que cada rol se ejerza con el compromiso y la calidad que el proyecto exige.</>},{q:'¿Quién es dueño del material inédito?',a:<>Los creadores conservan sus derechos morales sobre su trabajo, pero otorgan al estudio los derechos de explotación necesarios para cada proyecto. Todo el material de producción desarrollado para el estudio es propiedad de Wylder Creative Studio. La filtración de material inédito está estrictamente prohibida (NDA implícito).</>},{q:'¿Qué implica recibir un rango dentro del estudio?',a:<>La recepción oficial de cualquier rango —«Actor/Actriz de Doblaje», «Animador», «Director», entre otros— implica la <strong>aceptación absoluta</strong> de los Términos y Condiciones vigentes del estudio.</>},{q:'¿Necesito experiencia previa?',a:<>No es indispensable, pero sí valoramos el compromiso. Aceptamos perfiles en formación siempre que demuestren constancia, disposición a aprender y respeto por el trabajo del equipo.</>},{q:'¿Bajo qué legislación se rige el estudio?',a:<>Wylder Creative Studio se rige por las leyes aplicables en los <strong>Estados Unidos Mexicanos</strong>. Cualquier controversia se someterá a la jurisdicción de los tribunales competentes en territorio mexicano.</>}];
function FaqItem({q,a,open,onToggle}){const b=useRef(null);const[m,s]=useState(0);useEffect(()=>{if(b.current)s(open?b.current.scrollHeight:0)},[open,a]);useEffect(()=>{const r=()=>{if(open&&b.current)s(b.current.scrollHeight)};window.addEventListener('resize',r);return()=>window.removeEventListener('resize',r)},[open]);return <div className={`faq-item glass ${open?'open':''}`}><button className="faq-q" onClick={onToggle}>{q}<span className="faq-icon"></span></button><div className="faq-a" style={{maxHeight:`${m}px`}}><div ref={b} className="faq-a-inner">{a}</div></div></div>}
function FAQ(){const[i,s]=useState(-1);return <section id="faq"><div className="wrap"><div className="faq-wrap"><Reveal variant="left"><span className="eyebrow">06 — Preguntas frecuentes</span><h2 style={{margin:'1.1rem 0 1.2rem'}}>Dudas resueltas antes de dar el paso.</h2><p className="lede" style={{fontSize:'.95rem'}}>Si tu pregunta no aparece aquí, el mejor lugar para resolverla es nuestro Discord. Ahí está el equipo completo.</p><div className="recruit glass"><h3>¿Cómo unirse al equipo?</h3><p>El proceso es sencillo y abierto. Buscamos personas comprometidas, no solo talentosas.</p><ul><li>Tener <strong>16 años cumplidos</strong> como mínimo.</li><li>Enviar una muestra de tu trabajo (demo reel, portafolio o pieza audiovisual).</li><li>Pasar por una breve entrevista con el área correspondiente.</li><li>Aceptar los Términos y Condiciones del estudio al recibir tu rango.</li></ul><a href="https://discord.gg/324GhgCMbc" target="_blank" rel="noopener noreferrer" className="btn btn-primary">Postularme en Discord <Icon.Arrow/></a></div></Reveal><Reveal variant="right" className="faq-list">{FAQS.map((f,k)=><FaqItem key={k} q={f.q} a={f.a} open={i===k} onToggle={()=>s(i===k?-1:k)}/>)}</Reveal></div></div></section>}
function Terminos(){return <section id="terminos"><div className="wrap"><Reveal className="section-head"><span className="eyebrow">07 — Marco legal</span><h2>Términos y Condiciones.</h2><p className="lede">Documento vigente que rige la participación de toda persona dentro de Wylder Creative Studio. Léelo con atención antes de aceptar cualquier rango.</p></Reveal><Reveal variant="scale"><div className="terms-shell glass"><div className="terms-head"><div><h3 style={{marginBottom:'.35rem'}}>Wylder Creative Studio — Términos y Condiciones</h3><p className="text-muted" style={{fontSize:'.78rem'}}>Última actualización: vigente · Jurisdicción: Estados Unidos Mexicanos</p></div><span className="terms-badge">Documento oficial</span></div><div className="terms-scroll"><div className="term-block"><h4><span className="num">01</span> Aceptación de los términos</h4><p>La recepción oficial de cualquier rango dentro de Wylder Creative Studio —incluyendo, de forma enunciativa mas no limitativa: <strong>«Actor/Actriz de Doblaje»</strong>, <strong>«Animador»</strong>, <strong>«Director»</strong>, <strong>«Editor»</strong>, <strong>«Creador multimedia»</strong> o cualquier otro rol designado por el estudio— implica la <strong>aceptación absoluta e incondicional</strong> de los presentes Términos y Condiciones.</p><p>La aceptación se perfecciona en el momento en que la persona recibe y asume el rango correspondiente, sin que sea necesaria firma adicional alguna.</p></div><div className="term-block"><h4><span className="num">02</span> Edad mínima y capacidad legal</h4><p>Para participar en el estudio se requiere una <strong>edad mínima de 16 años cumplidos</strong>. Las personas menores de edad que deseen colaborar deberán contar con la autorización implícita de sus tutores legales.</p><div className="term-highlight"><b>Nota importante:</b> en caso de que la participación de una persona menor de edad implique cualquier tipo de contraprestación económica, se entiende que existe la autorización de su tutor legal, conforme a las disposiciones aplicables del derecho mexicano.</div></div><div className="term-block"><h4><span className="num">03</span> Modelo de reparto de ganancias (60/40)</h4><p>El modelo de reparto de ganancias de Wylder Creative Studio se aplica <strong>únicamente si el proyecto en cuestión genera ingresos reales (monetiza)</strong>. Si el proyecto no genera ingresos, no existirá obligación de pago alguna para ninguna de las partes.</p><p>Cuando exista monetización efectiva, la división neta será estrictamente la siguiente:</p><div className="term-highlight"><b>60%</b> — para el equipo de producción del proyecto.<br/><b>40%</b> — para la empresa (Wylder Creative Studio).</div><p style={{marginTop:'.9rem'}}>La base de cálculo será el ingreso <strong>neto</strong>, entendido como el total percibido menos los costos directos atribuibles al proyecto (plataformas, comisiones, herramientas, licencias y gastos operativos necesarios).</p></div><div className="term-block"><h4><span className="num">04</span> Propiedad intelectual</h4><p>Los creadores <strong>conservan sus derechos morales</strong> sobre las obras que produzcan. No obstante, otorgan a Wylder Creative Studio los <strong>derechos de explotación</strong> necesarios para la producción, distribución, promoción y monetización de los proyectos desarrollados dentro del estudio.</p><p>Todo el <strong>material de producción</strong> desarrollado para el estudio, en cualquiera de sus formas, es propiedad de Wylder Creative Studio.</p></div><div className="term-block"><h4><span className="num">05</span> Confidencialidad (NDA implícito)</h4><p>Queda estrictamente prohibida la <strong>filtración, divulgación o distribución</strong> de cualquier material inédito del estudio, incluyendo guiones, storyboards, avances, diseños, audios sin publicar y cualquier otra obra no difundida oficialmente.</p><p>La participación en el estudio constituye un <strong>acuerdo de confidencialidad implícito</strong>. El incumplimiento podrá dar lugar a la separación inmediata del estudio y a las acciones legales que correspondan.</p></div><div className="term-block"><h4><span className="num">06</span> Conducta y colaboración</h4><p>Toda persona que forme parte del estudio se compromete a mantener un trato respetuoso, profesional y colaborativo con el resto del equipo. No se tolerará el acoso, la discriminación, el plagio ni la apropiación indebida del trabajo ajeno.</p><p>Wylder Creative Studio se reserva el derecho de retirar a cualquier miembro que incumpla estos principios, sin perjuicio de las responsabilidades que pudieran derivarse.</p></div><div className="term-block"><h4><span className="num">07</span> Modificaciones</h4><p>Wylder Creative Studio podrá actualizar los presentes Términos y Condiciones cuando resulte necesario. Las modificaciones serán comunicadas por los canales oficiales del estudio y entrarán en vigor desde su publicación.</p></div><div className="term-block"><h4><span className="num">08</span> Jurisdicción y legislación aplicable</h4><p>Los presentes Términos y Condiciones se rigen por las leyes aplicables en los <strong>Estados Unidos Mexicanos</strong>. Cualquier controversia derivada de su interpretación o cumplimiento se someterá a la jurisdicción de los tribunales competentes en territorio mexicano.</p></div></div></div></Reveal></div></section>}
